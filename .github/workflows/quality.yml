name: Reflux — build e regressões puras

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.21.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Restaurar dependências do lockfile
        run: pnpm install --frozen-lockfile
      - name: Testar utilitários sem provedores externos
        run: pnpm test
      - name: Compilar NestJS e contratos TypeScript
        run: pnpm build
